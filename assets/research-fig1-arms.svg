<svg xmlns="http://www.w3.org/2000/svg" width="860" height="360" viewBox="0 0 860 360"><rect width="860" height="360" fill="#FFFFFF"/><text x="24" y="30" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#172033" font-weight="600">Figure 1. Six approaches: what each one reads, checks and lets decide</text><text x="300" y="70" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033" text-anchor="middle" font-weight="600">Reads</text><text x="300" y="88" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5B6578" text-anchor="middle">record fields / records + messages</text><text x="520" y="70" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033" text-anchor="middle" font-weight="600">Checks claims</text><text x="520" y="88" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5B6578" text-anchor="middle">against the records</text><text x="700" y="70" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033" text-anchor="middle" font-weight="600">Decides</text><text x="700" y="88" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5B6578" text-anchor="middle">policy / model / exact solver</text><rect x="16" y="98" width="828" height="38" fill="#F5F7FA"/><text x="30" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A1</text><text x="62" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Textbook reorder-point policy</text><rect x="208" y="107" width="184" height="22" rx="11" fill="#E8F0FE"/><text x="300" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle">Record fields only</text><circle cx="520" cy="118" r="8" fill="none" stroke="#E2E8F0" stroke-width="2"/><rect x="648" y="107" width="104" height="22" rx="4" fill="#5B6578"/><text x="700" y="122" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Policy</text><text x="30" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A2</text><text x="62" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Exact solver on record fields</text><rect x="208" y="145" width="184" height="22" rx="11" fill="#E8F0FE"/><text x="300" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#2563EB" text-anchor="middle">Record fields only</text><circle cx="520" cy="156" r="8" fill="none" stroke="#E2E8F0" stroke-width="2"/><rect x="648" y="145" width="104" height="22" rx="4" fill="#0F1B33"/><text x="700" y="160" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Solver</text><rect x="16" y="174" width="828" height="38" fill="#F5F7FA"/><text x="30" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A3</text><text x="62" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Language model</text><rect x="208" y="183" width="184" height="22" rx="11" fill="#E6F4F2"/><text x="300" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F766E" text-anchor="middle">Records + messages</text><circle cx="520" cy="194" r="8" fill="none" stroke="#E2E8F0" stroke-width="2"/><rect x="648" y="183" width="104" height="22" rx="4" fill="#B45309"/><text x="700" y="198" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Model</text><text x="30" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A4</text><text x="62" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Language model + validation</text><rect x="208" y="221" width="184" height="22" rx="11" fill="#E6F4F2"/><text x="300" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F766E" text-anchor="middle">Records + messages</text><circle cx="520" cy="232" r="8" fill="#0F766E"/><path d="M516,232 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/><rect x="648" y="221" width="104" height="22" rx="4" fill="#B45309"/><text x="700" y="236" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Model</text><rect x="16" y="250" width="828" height="38" fill="#F5F7FA"/><text x="30" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A5</text><text x="62" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Language model → solver</text><rect x="208" y="259" width="184" height="22" rx="11" fill="#E6F4F2"/><text x="300" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F766E" text-anchor="middle">Records + messages</text><circle cx="520" cy="270" r="8" fill="none" stroke="#E2E8F0" stroke-width="2"/><rect x="648" y="259" width="104" height="22" rx="4" fill="#0F1B33"/><text x="700" y="274" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Solver</text><text x="30" y="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#2563EB" font-weight="700">A6</text><text x="62" y="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#172033">Language model → solver + validation</text><rect x="208" y="297" width="184" height="22" rx="11" fill="#E6F4F2"/><text x="300" y="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#0F766E" text-anchor="middle">Records + messages</text><circle cx="520" cy="308" r="8" fill="#0F766E"/><path d="M516,308 l3,3 l6,-6" stroke="#fff" stroke-width="2" fill="none"/><rect x="648" y="297" width="104" height="22" rx="4" fill="#0F1B33"/><text x="700" y="312" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#fff" text-anchor="middle" font-weight="600">Solver</text><text x="24" y="342" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" fill="#5B6578">Every approach must state the facts it ordered on (x̂). Reference arms: R1 rule-based parser + solver, R2 solver on the true state, R3 model on the true state.</text></svg>
